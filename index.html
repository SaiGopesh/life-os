<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18211E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA; --card:#FFFFFF; --sunk:#E4E7DF; --ink:#18211E; --muted:#58645E; --line:#D3D8CE;
  --accent:#2C4A94; --accent-ink:#FFFFFF; --accent-soft:#DEE5F6;
  --now:#D98E04; --now-soft:#FBEFD3;
  --veg:#2D7A45; --veg-soft:#DCEFE1; --meat:#A5402F; --meat-soft:#F5DFD9;
  --fit:#1D6F6A; --fit-soft:#D5ECE9; --meal:#8A5A12; --meal-soft:#F3E6CF; --grey:#7A847F; --grey-soft:#E6E9E4;
  --danger:#B3261E; --ok:#2D7A45;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:16px; --r-md:10px; --r-sm:6px;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#121614; --card:#1A201D; --sunk:#0F1311; --ink:#E5EAE6; --muted:#9BA6A0; --line:#2B332F;
  --accent:#93ADF2; --accent-ink:#0E1630; --accent-soft:#222C45; --now:#F2B23E; --now-soft:#3A2F17;
  --veg:#72C48C; --veg-soft:#1D3325; --meat:#EA8E7E; --meat-soft:#3A2420; --fit:#6CC5BD; --fit-soft:#183331; --meal:#E2B66B; --meal-soft:#352A17; --grey:#8E9893; --grey-soft:#232A26;
  --danger:#F08A84; --ok:#72C48C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#121614; --card:#1A201D; --sunk:#0F1311; --ink:#E5EAE6; --muted:#9BA6A0; --line:#2B332F;
  --accent:#93ADF2; --accent-ink:#0E1630; --accent-soft:#222C45; --now:#F2B23E; --now-soft:#3A2F17;
  --veg:#72C48C; --veg-soft:#1D3325; --meat:#EA8E7E; --meat-soft:#3A2420; --fit:#6CC5BD; --fit-soft:#183331; --meal:#E2B66B; --meal-soft:#352A17; --grey:#8E9893; --grey-soft:#232A26;
  --danger:#F08A84; --ok:#72C48C; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:19px;font-weight:650;line-height:1.25}
h3{font-size:16px;font-weight:600}
p{margin:.4em 0}
small,.muted{color:var(--muted)}
.wrap{max-width:1160px;margin:0 auto;padding:18px 16px 110px}
@media (min-width:900px){ .wrap{padding:26px 28px 60px} }

/* shell */
.shell{display:block}
nav.rail{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
nav.rail a{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:10px;font-weight:600;border-radius:var(--r-md);min-width:0;letter-spacing:-.01em;overflow:hidden;white-space:nowrap}
nav.rail a svg{width:21px;height:21px}
nav.rail a[aria-current="page"]{color:var(--accent)}
nav.rail .brand,nav.rail .grow,nav.rail .store,nav.rail .full{display:none}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:212px 1fr}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:22px 12px;gap:2px;background:var(--paper)}
  nav.rail a{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:9px 12px;justify-content:flex-start}
  nav.rail a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  nav.rail .full{display:inline} nav.rail .short{display:none}
  nav.rail .brand{display:block;font:700 21px/1 var(--display);padding:2px 12px 20px}
  nav.rail .brand span{display:block;font:500 12px var(--ui);color:var(--muted);margin-top:6px}
  nav.rail .grow{display:block;flex:1}
  nav.rail .store{display:block;font-size:12px;color:var(--muted);padding:8px 12px;line-height:1.4}
}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:16px}
.top .grow{flex:1;min-width:200px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* cards & grid */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*,.stack>*{min-width:0}
.note+.note{margin-top:8px}
.ribbon .ttl{min-width:0;overflow-wrap:anywhere}
@media (min-width:720px){ .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1000px){ .today{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.flat{background:transparent;border-style:dashed}
.card h2{margin-bottom:8px}
.card .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card .head h2{margin:0;flex:1}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.sp{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;padding:6px 8px}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=email],input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;min-width:0;width:100%;color:var(--ink);font-weight:400;font-size:15px}
textarea{min-height:84px;resize:vertical;line-height:1.45}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.fields .wide{grid-column:1/-1}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
input[type=range]{width:100%;accent-color:var(--accent)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.badge.veg{background:var(--veg-soft);color:var(--veg)} .badge.nonveg{background:var(--meat-soft);color:var(--meat)}
.badge.acc{background:var(--accent-soft);color:var(--accent)} .badge.now{background:var(--now-soft);color:var(--now)}
.badge.fit{background:var(--fit-soft);color:var(--fit)} .badge.warn{background:var(--meat-soft);color:var(--danger)}

/* timeline: the day ribbon */
.ribbon{position:relative;list-style:none;margin:0;padding:0}
.ribbon li{display:grid;grid-template-columns:52px 22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line);position:relative}
.ribbon li:first-child{border-top:0}
.ribbon .t{font:600 13px/1.3 var(--display);color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
.ribbon .t small{display:block;font:500 11px var(--ui)}
.ribbon .bar{position:absolute;left:58px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--grey)}
.ribbon li[data-cat=career] .bar{background:var(--accent)} .ribbon li[data-cat=fitness] .bar{background:var(--fit)} .ribbon li[data-cat=meal] .bar{background:var(--meal)} .ribbon li[data-cat=sleep] .bar{background:var(--muted)}
.ribbon li[data-cat=work] .bar,.ribbon li[data-cat=commute] .bar{background:var(--line)}
.ribbon .ttl{font-weight:600;line-height:1.35}
.ribbon .ttl small{display:block;font-weight:500}
.ribbon li.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ribbon li.isnow{background:linear-gradient(90deg,var(--now-soft),transparent 70%);border-radius:8px}
.ribbon li.isnow .t{color:var(--now)}
.ribbon li.conflict .ttl::after{content:" Overlaps another block";display:block;color:var(--danger);font-size:12px;font-weight:600}
.ribbon li[data-cat=work] .ttl,.ribbon li[data-cat=commute] .ttl{color:var(--muted);font-weight:500}
.ribbon .acts{display:flex;gap:2px}

/* next task hero */
.next{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:18px;display:grid;gap:8px}
.next .lbl{font-size:13px;opacity:.75;font-weight:600}
.next .what{font:700 24px/1.15 var(--display)}
.next .when{font-variant-numeric:tabular-nums;opacity:.85}
.next .btn{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.35)}
.next .btn.primary{background:var(--now);border-color:var(--now);color:#1A1405}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .next .btn{border-color:rgba(0,0,0,.25)} }

/* progress */
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.fit>i{background:var(--fit)} .meter.meal>i{background:var(--meal)} .meter.over>i{background:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.stat{display:flex;flex-direction:column}
.stat b{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .t1{font-weight:600}
.list .t2{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input[type=number]{width:84px}
tr.catrow td{background:var(--sunk);font-weight:700;font-size:13px}
tr.checked td{color:var(--muted);text-decoration:line-through}

/* meals */
.meal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .slot{font-size:12px;font-weight:700;color:var(--muted)}
.meal .nm{font-weight:600}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.daycol{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;min-width:150px}
.daycol.veg{border-top:4px solid var(--veg)} .daycol.nonveg{border-top:4px solid var(--meat)}
.daycol.today{outline:2px solid var(--now)}
.daycol .m{font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.daycol .m button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,14,12,.5);padding:16px;overflow:auto}
.modal.open{display:block}
.modal .box{background:var(--card);color:var(--ink);max-width:720px;margin:24px auto 80px;border-radius:var(--r-lg);border:1px solid var(--line);padding:18px}
.modal .box .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.modal .box .head h2{flex:1;font-size:22px}

/* timers */
.timers{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 24px)}
@media (min-width:900px){ .timers{bottom:20px} }
.timer{background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;min-width:66px}
.timer .l{font-size:13px;max-width:180px;line-height:1.25}
.timer button{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.12)}
.timer.ring{background:var(--now);color:#1A1405}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
@media (min-width:900px){ .toast{bottom:24px} }
.note{border-left:3px solid var(--now);background:var(--now-soft);padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:14px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.bad{border-color:var(--danger);background:var(--meat-soft)}
.note.good{border-color:var(--veg);background:var(--veg-soft)}
.pill-choice{display:flex;gap:6px;flex-wrap:wrap}
.pill-choice button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.pill-choice button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quiz label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);margin:4px 0;cursor:pointer;font-weight:500;color:var(--ink);font-size:14px}
.quiz label.right{border-color:var(--veg);background:var(--veg-soft)} .quiz label.wrong{border-color:var(--danger);background:var(--meat-soft)}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r-md);overflow:hidden;margin:8px 0}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
figure.demo{margin:8px 0;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
figure.demo.sm{max-width:230px} figure.demo.xs{max-width:100%;margin:0 0 8px}
figure.demo img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
figure.demo figcaption{font-size:12px;color:#55605a;padding:5px 8px;background:#f6f7f4;line-height:1.35}
figure.demo figcaption a{color:#2C4A94}
figure.demo .demo-fallback{display:none;padding:12px;font-size:13px;color:#3a443f}
figure.demo.broken img{display:none} figure.demo.broken .demo-fallback{display:block}
.vidpin{border:1px dashed var(--line);border-radius:var(--r-md);padding:12px;margin:8px 0;background:var(--sunk)}
.vidpin ol{margin:6px 0 8px;padding-left:20px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--ui);fill:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:6px 0}
.steps li::before{content:counter(s);font:700 14px/26px var(--display);text-align:center;width:26px;height:26px;border-radius:50%;background:var(--sunk)}
.chk{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk.done .ttl{color:var(--muted);text-decoration:line-through}
.labels{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.label{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;background:var(--card)}
.label b{font-family:var(--display);font-size:15px}
.label.veg{border-color:var(--veg)} .label.nonveg{border-color:var(--meat)}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 70px 34px;gap:6px;align-items:center;margin:4px 0}
.setrow input{text-align:center}
@media print{ nav.rail,.timers,.tabs,.noprint{display:none!important} .wrap{padding:0} .card{border:0} body{background:#fff;color:#000} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

</style>
</head>
<body>
<div class="shell">
  <nav class="rail" id="nav" aria-label="Main"></nav>
  <main class="wrap" id="view" tabindex="-1"><p class="muted">Loading your plan…</p></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box"></div></div>
<div class="timers" id="timers" aria-live="polite"></div>
<noscript>Life OS needs JavaScript enabled.</noscript>
<script>
/* ===== Food data: ingredients (UK own-brand price ESTIMATES, editable) and recipes ===== */
/* Nutrition per 100 g/ml, or per item when unit is "each"/"slice"/"clove"/"tin". Values are typical UK label figures, rounded. */
const INGREDIENTS = {
  oats:        {name:"Rolled oats", unit:"g", pack:1000, price:1.15, cat:"Grains & pantry", store:"Cupboard, 6+ months", n:[375,11,60,8,9]},
  rice:        {name:"Long-grain or basmati rice (dry)", unit:"g", pack:1000, price:1.45, cat:"Grains & pantry", store:"Cupboard, 12 months", n:[352,8,78,1,1.5]},
  pasta:       {name:"Wholewheat dried pasta (egg-free)", unit:"g", pack:500, price:0.75, cat:"Grains & pantry", store:"Cupboard, 12 months", n:[340,13,63,2.5,9], note:"Dried pasta is normally egg-free; fresh pasta usually contains egg — check the label."},
  lentils:     {name:"Dried red lentils", unit:"g", pack:1000, price:2.10, cat:"Grains & pantry", store:"Cupboard, 12 months", n:[325,24,49,1.5,5]},
  chickpeas:   {name:"Chickpeas, tinned (400 g tin, 240 g drained)", unit:"tin", pack:1, price:0.55, cat:"Tins & jars", store:"Cupboard; once open, fridge 2 days", n:[290,17,32,7,12]},
  kidney:      {name:"Red kidney beans, tinned (400 g tin)", unit:"tin", pack:1, price:0.45, cat:"Tins & jars", store:"Cupboard; once open, fridge 2 days", n:[240,17,31,1.2,15]},

  {id:"L1", week:1, track:"E", skill:"sql", title:"Window functions for analysis", minutes:60,
   explain:"Window functions compute values across related rows without collapsing them. ROW_NUMBER, RANK and DENSE_RANK order rows within a PARTITION BY group; LAG/LEAD compare a row with its neighbours; SUM/AVG OVER with ROWS BETWEEN frames give running totals and moving averages. The common interview trap is the frame: with ORDER BY and no frame, the default is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW, which treats tied values as one group.",
   exercise:"Using any orders table (or create one with 20 rows): 1) return each customer's latest order; 2) month-over-month revenue change using LAG; 3) a 3-month moving average with an explicit ROWS frame. Save the queries in a gist or repo.",
   quiz:[{q:"Which function gives tied rows the same rank and leaves no gaps?", o:["ROW_NUMBER","RANK","DENSE_RANK","NTILE"], a:2},
         {q:"Default frame when ORDER BY is used in an aggregate window without a frame clause?", o:["ROWS UNBOUNDED PRECEDING to CURRENT ROW","RANGE UNBOUNDED PRECEDING to CURRENT ROW","The whole partition","Only the current row"], a:1},
         {q:"Best way to get each customer's most recent order?", o:["GROUP BY customer with MAX(order_id)","ROW_NUMBER() OVER (PARTITION BY customer ORDER BY order_date DESC) = 1","DISTINCT customer","LEAD(order_date)"], a:1}],

  {id:"L3", week:1, track:"A", skill:"storytelling", title:"Tailoring a CV to a job description", minutes:45,

  {id:"L4", week:2, track:"A", skill:"modelling", title:"Star schema done properly", minutes:60,
   explain:"A star schema has fact tables (events at a declared grain) and dimension tables (descriptive attributes). Decide the grain first: one row per order line, per day per store, and so on. Use surrogate keys, a proper date dimension, single-direction relationships from dimension to fact, and avoid bidirectional filters unless there is a clear reason. Slowly changing dimensions (Type 1 overwrite, Type 2 history rows) preserve history where it matters.",
   exercise:"Choose a UK public dataset (for example ONS or data.gov.uk). Write down the grain, sketch the fact and 3–4 dimensions, then build it in Power BI with a date table marked as a date table.",

  {id:"L5", week:2, track:"A", skill:"powerbi", title:"DAX: filter context and time intelligence", minutes:75,
   explain:"Every measure is evaluated in a filter context. CALCULATE changes that context; context transition turns row context into filter context inside iterators. Time intelligence (TOTALYTD, SAMEPERIODLASTYEAR, DATEADD) needs a contiguous, marked date table. Variables (VAR) make measures faster and easier to read. Calculation groups remove duplicated time measures.",

function lineChart(points, o = {}) {

  let learn = 0, mocks = 0; C.weekDates(ws).forEach(d => { const day = getDay(d); blocksFor(d).forEach(b => { if (day.done && day.done[b.id]) { if (["tech","coding","morning"].includes(b.id)) learn += (day.actual && day.actual[b.id]) || b.mins; if (b.id === "interview" || b.id === "morning") mocks += 1; } }); });

function currentAndNext(blocks, day) {
  const m = nowMin(); const cur = blocks.find(b => C.toMin(b.start) <= m && m < C.toMin(b.start) + b.mins);
  const nxt = blocks.find(b => C.toMin(b.start) + b.mins > m && !(day.done && day.done[b.id]) && !["work","commute","sleep"].includes(b.cat) && b !== cur && C.toMin(b.start) >= (cur ? C.toMin(cur.start) : 0));
  return {cur, nxt};
}

function goalAlerts(k) {

function draftsHTML(j, an, p) {

  const email = `Subject: ${j.role || "[Role]"} at ${j.company || "[Company]"} — ${p.name}\n\nHi ${first},\n\nI'm interested in the ${j.role || "[role]"} role at ${j.company || "[company]"}${j.status === "Applied" ? ", and I have submitted my application" : ""}. I hold ${p.quals}.\n\nThe role's focus on ${top} matches my experience: [add one specific, true example — what you did and the result].\n\nWould you be open to a short call, or could you share what the team is prioritising this year?\n\nThank you,\n${p.name}\n${p.links || "[LinkedIn / portfolio link]"}`;
  const li = `Hi ${first}, I'm a data professional (${p.qualsShort}) interested in the ${j.role || "[role]"} role at ${j.company || "[company]"}. I'd value connecting and hearing what the team is working on. Thanks, ${me}`;

  <label class="f">LinkedIn connection note <small>(${li.length}/300 characters${li.length > 300 ? " — too long, shorten it" : ""})</small><textarea id="dLi" style="min-height:80px">${esc(li)}</textarea></label><div class="row" style="margin:4px 0 10px"><button class="btn small" data-act="copy" data-target="dLi">Copy</button></div>
  <label class="f">Follow-up email<textarea id="dFu" style="min-height:150px">${esc(fu)}</textarea></label><div class="row" style="margin:4px 0"><button class="btn small" data-act="copy" data-target="dFu">Copy</button></div>
  <p class="muted" style="font-size:13px">Fill every [bracket] with something true. The drafts only use the qualifications in your profile.</p>`;

ACT.saveJob = () => {

function exDemo(id) { return EXERCISES[id].demo; }
/* In-page demo: your saved YouTube video, else the verified StrengthLog animation for this exercise. */
function exDemoHTML(id, size) {
  const e = EXERCISES[id], m = EX_MEDIA[id];
  if (!m) return "";

document.addEventListener("error", ev => { const f = ev.target && ev.target.tagName === "IMG" && ev.target.closest("figure.demo"); if (f) f.classList.add("broken"); }, true);
function altName(a) { return EXERCISES[a] ? EXERCISES[a].name : a; }
function lastSetsFor(ex, beforeDate) {
  const ws = recs("workout").filter(w => w.date < beforeDate && (w.sets || []).some(s => s.ex === ex && s.done)).sort((a, b) => b.date.localeCompare(a.date));
  return ws.length ? ws[0].sets.filter(s => s.ex === ex && s.done) : null;
}
VIEWS.train = () => {
  const t = sub("train", "week");
  const k0 = todayKey(); const wk = beforeStart(k0) ? `starts ${shortDate(planStart())}` : `week ${Math.floor(C.daysBetween(planStart(), k0) / 7) + 1}`;
  const head = `<div class="top"><div class="grow"><div class="eyebrow">${esc(settings().training.experience)} · ${wk} · ${settings().schedule.trainTime === "morning" ? "before work" : "after work"}</div><h1>Training</h1></div><button class="btn primary" data-act="startSession" data-date="${todayKey()}">Today's session</button></div>`;
  const body = t === "session" ? trainSession(S.ui.sessDate || todayKey()) : t === "library" ? trainLibrary() : t === "history" ? trainHistory() : t === "recovery" ? trainRecovery() : trainWeek();
  return head + tabs("train", [["week", "Weekly programme"], ["session", "Workout session"], ["library", "Workout videos"], ["history", "History & strength"], ["recovery", "Recovery"]]) + body;
};
function trainWeek() {
  return `<div class="card" style="margin-bottom:12px"><h2>Building muscle, abs and shape</h2><p style="font-size:14px;line-height:1.6">Each upper session gives shoulders, back and arms extra work for a broader frame. Every session ends with direct ab work (cable crunches, hanging knee raises, side planks, Pallof presses), trained with progressive overload like any other muscle. Honest note: abs become <b>visible</b> mainly through losing fat — usually around 10–12% body fat for men. Training builds the muscle; your calorie deficit uncovers it. While losing fat, you can still build muscle as a beginner-to-intermediate lifter, provided you eat enough protein (your target is set in Settings) and keep progressing your weights.</p></div>
  <div class="note info" style="margin-bottom:12px">Three gym sessions and one short home session a week. No cardio is added: your postal round is about 15,000 steps a day with a load, so volume is kept moderate (about 10–16 hard sets per muscle per week) and every set stops 1–3 reps before failure. Progression: once you hit the top of the rep range on every set, add the smallest weight step (≈2.5 kg; 1–2 kg for dumbbells).</div>
  <div class="grid g2">${[0,1,2,3,4,5,6].map(i => { const p = PROGRAMME[i];
    return `<div class="card"><div class="head"><h2>${C.DAY_NAMES[i]}</h2>${p ? `<span class="badge fit">${p.minutes} min · ${p.place}</span>` : `<span class="badge">Recovery</span>`}</div>
    ${p ? `<h3>${esc(p.name)}</h3><p class="muted" style="font-size:13px">Warm-up 5 min (NHS video) + 1–2 light sets of the first exercise. Cool-down: NHS stretches.</p><div class="tbl"><table><thead><tr><th>Exercise</th><th class="num">Sets</th><th>Reps</th><th class="num">Rest</th></tr></thead><tbody>${p.ex.map(([id, s, r, rest]) => `<tr><td><button class="btn ghost" style="padding:0;text-align:left" data-act="openEx" data-id="${id}">${esc(EXERCISES[id].name)}</button><br><small>Home: ${esc(altName(EXERCISES[id].home))}</small></td><td class="num">${s}</td><td>${esc(r)}</td><td class="num">${rest}s</td></tr>`).join("")}</tbody></table></div>`
      : `<p>${esc(RECOVERY_DAYS[i])}</p>`}</div>`; }).join("")}</div>`;
}
ACT.startSession = el => { S.ui.sessDate = el.dataset.date; go("train", "session"); };
function getWorkout(k) { const p = sessionFor(k) || PROGRAMME[C.weekday(k)]; return S.rec.get("wk:" + k) || {id: "wk:" + k, type: "workout", date: k, prog: p ? p.id : null, name: p ? p.name : "Session", sets: [], exDone: {}, swaps: {}, completed: false}; }
function trainSession(k) {
  const p = sessionFor(k);
  if (!p) return `<div class="card"><h2>${shortDate(k)} is a recovery day</h2><p>${esc(RECOVERY_DAYS[C.weekday(k)] || "Easy walk and mobility.")}</p><p class="muted">Want to train anyway? Pick the home full-body session.</p><button class="btn" data-act="forceSession" data-date="${k}">Do the home session instead</button></div>`;
  const w = getWorkout(k); const nhsWarm = NHS_SESSIONS.find(x => x.id === "nhs-warmup"), nhsStr = NHS_SESSIONS.find(x => x.id === "nhs-stretch");
  return `<div class="row" style="margin-bottom:12px"><h2 style="flex:1">${esc(p.name)} · ${shortDate(k)}</h2>${w.completed ? '<span class="badge fit">Completed</span>' : ""}</div>${p.note ? `<div class="note info" style="margin-bottom:12px">${esc(p.note)}: main lifts first, 2 sets each, one ab exercise (~${p.minutes} min). <button class="btn small" data-act="editDay" data-date="${k}">Do the full session instead</button></div>` : ""}
  <div class="card" style="margin-bottom:12px"><div class="head"><h2>1. Warm-up (5 min)</h2>${linkOut(nhsWarm.link.url, "NHS warm-up video")}</div><p style="font-size:14px">${esc(nhsWarm.link.note)} Then do 1–2 light sets of your first exercise.</p><button class="btn small" data-act="timer" data-label="Warm-up" data-min="5">Start 5-min timer</button></div>
  ${(p.ex).map(([id0, sets, reps, rest], i) => { const id = (w.swaps && w.swaps[id0]) || id0; const e = EXERCISES[id]; const d = exDemo(id); const last = lastSetsFor(id, k); const nt = C.nextTarget(last, reps, settings().training.increment);
    const rows = []; for (let s = 1; s <= sets; s++) { const st = (w.sets || []).find(x => x.ex === id && x.set === s) || {}; rows.push(`<div class="setrow"><b aria-label="Set ${s}">#${s}</b><input type="number" step="0.5" min="0" placeholder="${nt.weight != null ? nt.weight : "kg"}" value="${st.kg ?? ""}" data-on="setVal" data-date="${k}" data-ex="${id}" data-set="${s}" data-f="kg" aria-label="Set ${s} weight kg"><input type="number" min="0" placeholder="${/s\b/.test(reps) ? "sec" : "reps"}" value="${st.reps ?? ""}" data-on="setVal" data-date="${k}" data-ex="${id}" data-set="${s}" data-f="reps" aria-label="Set ${s} reps"><select data-on="setVal" data-date="${k}" data-ex="${id}" data-set="${s}" data-f="rir" aria-label="Reps in reserve">${["", "0", "1", "2", "3", "4+"].map(v => `<option value="${v}" ${String(st.rir ?? "") === v ? "selected" : ""}>${v === "" ? "RIR" : v}</option>`).join("")}</select><input type="checkbox" data-on="setDone" data-date="${k}" data-ex="${id}" data-set="${s}" data-rest="${rest}" ${st.done ? "checked" : ""} aria-label="Set ${s} done"></div>`); }

    <div class="row" style="margin-bottom:8px">${EX_MEDIA[id] || (kv("exVideos") || {})[id] ? "" : `<button class="btn small" data-act="openEx" data-id="${id}">▶ Add a video</button>`}${e.alt ? linkOut(e.alt.url, "NHS video") : ""}<button class="btn small" data-act="openEx" data-id="${id}">Form & safety</button></div>
    <div class="note info" style="margin-bottom:8px">${esc(nt.note)}${last ? ` Last time: ${last.map(x => (x.kg || 0) + "×" + (x.reps || 0)).join(", ")}.` : ""}</div>
    <div class="setrow muted" style="font-size:12px;font-weight:700"><span></span><span>kg</span><span>${/s\b/.test(reps) ? "seconds" : "reps"}</span><span>RIR</span><span>✓</span></div>${rows.join("")}
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="timer" data-label="Rest: ${esc(e.name)}" data-min="${rest / 60}">Rest timer ${rest}s</button><button class="btn small ${w.exDone && w.exDone[id] ? "" : "primary"}" data-act="exDone" data-date="${k}" data-id="${id}">${w.exDone && w.exDone[id] ? "Undo complete" : "Mark exercise complete"}</button>
    <select data-on="swapEx" data-date="${k}" data-orig="${id0}" style="max-width:220px" aria-label="Swap exercise"><option value="">Swap exercise…</option>${[id0, e.easier, EXERCISES[id0].home].filter((v, j, a) => v && EXERCISES[v] && a.indexOf(v) === j).map(v => `<option value="${v}" ${v === id ? "selected" : ""}>${esc(EXERCISES[v].name)}${v === id0 ? " (planned)" : v === EXERCISES[id0].home ? " (home)" : " (easier)"}</option>`).join("")}</select></div></div>`; }).join("")}
  <div class="card" style="margin-bottom:12px"><div class="head"><h2>${p.ex.length + 2}. Cool-down</h2>${linkOut(nhsStr.link.url, "NHS stretch videos")}</div><p style="font-size:14px">${esc(nhsStr.desc)} No extra cardio needed — your ~15,000-step round already covers it.</p></div>
  <label class="f">Session notes<textarea data-on="wkNotes" data-date="${k}">${esc(w.notes || "")}</textarea></label>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn primary" data-act="finishWorkout" data-date="${k}">${w.completed ? "Update workout" : "Finish workout"}</button></div>`;

function prepWindow(k) {
  const pw = settings().schedule.prepWeekdays.slice().sort(); let s0 = null;
  for (let b = 0; b < 7; b++) { const d = C.addDays(k, b); if (pw.includes(C.weekday(d))) { s0 = d; break; } }
  if (!s0) return null; let e = null; for (let b = 1; b <= 7; b++) { const d = C.addDays(s0, b); if (pw.includes(C.weekday(d))) { e = d; break; } }
  const dates = []; for (let d = C.addDays(s0, 1); d <= (e || C.addDays(s0, 4)); d = C.addDays(d, 1)) dates.push(d);
  return {date: s0, dates};
}

function progHabits() {
  const hs = kv("habits") || []; const days = [...Array(14)].map((_, i) => C.addDays(todayKey(), -13 + i));
  const streak = id => { let n = 0; for (let i = days.length - 1; i >= 0; i--) { if ((getDay(days[i]).habits || {})[id]) n++; else if (i !== days.length - 1) break; } return n; };
  return `<div class="card tbl"><table><thead><tr><th>Habit</th>${days.map(d => `<th class="num">${C.DAY_SHORT[C.weekday(d)][0]}<br>${C.parse(d).getDate()}</th>`).join("")}<th class="num">Streak</th><th></th></tr></thead><tbody>${hs.map(h => `<tr><td><input type="text" value="${esc(h.name)}" data-on="habitName" data-id="${h.id}" aria-label="Habit name" style="min-width:150px"></td>${days.map(d => `<td class="num"><input type="checkbox" data-on="habit" data-date="${d}" data-id="${h.id}" ${(getDay(d).habits || {})[h.id] ? "checked" : ""} aria-label="${esc(h.name)} on ${d}"></td>`).join("")}<td class="num"><b>${streak(h.id)}</b></td><td><button class="btn ghost small" data-act="delHabit" data-id="${h.id}" aria-label="Delete habit">✕</button></td></tr>`).join("")}</tbody></table>
  <div class="row" style="margin-top:10px"><input type="text" id="newHabit" placeholder="New habit" style="max-width:260px" aria-label="New habit"><button class="btn" data-act="addHabit">Add habit</button></div></div>`;

ACT.checkImport = async () => {
  let txt = $("#impText").value.trim(); const f = $("#impFile").files && $("#impFile").files[0];
  if (!txt && f) { if (f.size > 20 * 1024 * 1024) return showImp(`<div class="note bad">That file is over 20 MB — it is not a Life OS backup.</div>`); txt = await f.text(); }
  if (!txt) return showImp(`<div class="note bad">Choose a file or paste the backup text first.</div>`);
  let obj; try { obj = JSON.parse(txt); } catch (e) { return showImp(`<div class="note bad">This isn't valid JSON (${esc(e.message)}). Nothing was changed.</div>`); }
  const v = C.validateBackup(obj); S.ui.pendingImport = v.ok ? obj : null;
  showImp(v.ok ? `<div class="note good">Backup looks valid: ${Object.entries(v.counts).map(([t, n]) => `${n} ${t}`).join(", ") || "settings only"}. Exported ${esc(obj.exported || "unknown date")}.</div><div class="row" style="margin-top:8px"><button class="btn" data-act="doImport" data-mode="merge">Merge (keep my current entries when IDs clash)</button><button class="btn danger" data-act="doImport" data-mode="replace">Replace everything…</button></div>`
    : `<div class="note bad"><b>Not imported.</b><ul>${v.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div>`);

function showImp(h) { $("#impResult").innerHTML = h; }
ACT.doImport = el => { const obj = S.ui.pendingImport; if (!obj) return; const mode = el.dataset.mode;
  const go = async () => { const existing = []; S.rec.forEach(r => existing.push(r)); const m = C.mergeRecords(existing, obj.data.records, mode);
    const newKV = mode === "replace" ? Object.assign(DEFAULTS(), obj.data.kv || {}) : Object.assign({}, obj.data.kv || {}, S.kv);
    if (mode === "replace") newKV.settings = Object.assign(DEFAULTS().settings, (obj.data.kv || {}).settings || {});
    S.kv = newKV; S.rec = new Map(m.records.map(r => [r.id, r])); await Store.replaceAll(S.kv, m.records); refreshCatalog(); applyTheme();
    S.ui.pendingImport = null; toast(mode === "replace" ? "Backup restored" : `Merged: ${m.added} added, ${m.conflicts} kept as they were`); render(); };
  if (mode === "replace") ask("Replace all data?", "Everything currently on this device will be replaced by the backup. Export a backup of your current data first if you might need it.", "Replace everything", go, true); else go(); };
ACT.wipe = () => openModal(() => `${modalHead("Erase all data?")}<p>This deletes every job, workout, weight, meal log and setting on this device. Type <b>ERASE</b> to confirm.</p><input type="text" id="wipeTxt" aria-label="Type ERASE"><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="wipeYes">Erase</button></div>`);

/* ===== Interview prep ===== */
const WPM = 140;
const words = s => (String(s || "").trim().match(/\S+/g) || []).length;
const speakTime = n => { const s = Math.round(n / WPM * 60); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + (s % 60) + " s"; };
function intro() { return Object.assign({track: "A", present: "", project: "", why: "", role: "", company: ""}, kv("intro") || {}); }
function introScripts(o) {
  const p = settings().profile; const name = p.name || "[your name]";
  const present = o.present.trim() || "[What you do now, in one line — name a transferable strength]";
  const project = o.project.trim() || "[One project: the problem, what you built, the result]";
  const why = o.why.trim() || "[One line on why this role or organisation appeals to you]";
  const role = o.role.trim() || "[role]"; const company = o.company.trim() ? " at " + o.company.trim() : "";
  const long = `I'm ${name}. ${present.replace(/\.$/, "")}. I completed an MSc in Data Science with First Class Honours, and I hold Microsoft's DP-600, DP-700 and PL-300 certifications. Most recently, ${project.replace(/\.$/, "")}. What I enjoy most is ${INTRO_FOCUS[o.track]}. ${why.replace(/\.$/, "")}, which is why I'm keen on this ${role} role${company}.`;
  const short = `I'm ${name}, a data professional with an MSc in Data Science (First Class) and Microsoft DP-600, DP-700 and PL-300 certifications. I focus on ${INTRO_FOCUS[o.track].split(" — ")[0]}, and I'm looking for a ${role} role where I can do that every day.`;
  return {long, short};
}
function starAns(id) { return S.rec.get("ans:" + id) || {id: "ans:" + id, type: "answer", qid: id, S: "", T: "", A: "", R: "", L: ""}; }
function starReady(a) { return ["S","T","A","R"].every(k => (a[k] || "").trim().length > 10); }
function starCheck(a) {
  const all = ["S","T","A","R","L"].map(k => a[k] || "").join(" "); const n = words(all);
  const i = (a.A.match(/\bI\b|\bI'm\b|\bI've\b|\bmy\b/g) || []).length, we = (a.A.match(/\bwe\b|\bour\b/gi) || []).length;
  const aShare = n ? words(a.A) / n : 0;
  return [
    {ok: ["S","T","A","R"].every(k => (a[k] || "").trim()), msg: "All four STAR parts filled in"},
    {ok: n >= 150 && n <= 320, msg: `Length ${n} words ≈ ${speakTime(n)} spoken (aim for 150–320 words, 1–2 min)`},
    {ok: aShare >= 0.4, msg: `Action is ${Math.round(aShare * 100)}% of the answer (aim for 40%+ — it's what they score)`},
    {ok: i >= we && i > 0, msg: `Action uses "I" ${i}× and "we" ${we}× — make your own contribution clear`},
    {ok: /\d/.test(a.R), msg: "Result includes a number or measurable outcome"},
    {ok: (a.L || "").trim().length > 10, msg: "Includes what you learned or would do differently"}
  ];
}
function interviewStats() {
  const ready = STAR_QS.filter(q => starReady(starAns(q.id))).length;
  const common = COMMON_QS.filter(q => (S.rec.get("cans:" + q.id) || {}).text).length;
  const mocks = recs("mock").sort((a, b) => b.date.localeCompare(a.date));
  return {ready, common, mocks, introDone: !!(kv("intro") && kv("intro").present && kv("intro").project)};
}

VIEWS.interview = () => {

  const body = t === "intro" ? ivIntro() : t === "comms" ? ivComms() : t === "star" ? ivStar() : t === "common" ? ivCommon() : t === "mock" ? ivMock() : ivOverview();
  return head + tabs("interview", [["overview", "Overview"], ["intro", "Self-intro"], ["comms", "Communication"], ["star", "STAR questions"], ["common", "Common questions"], ["mock", "Mock interviews"]]) + body;
};

function ivOverview() {
  const st = interviewStats(); const k = todayKey();
  const up = recs("job").filter(j => (j.interviewDate && j.interviewDate >= k) || (j.assessmentDate && j.assessmentDate >= k)).sort((a, b) => (a.interviewDate || a.assessmentDate).localeCompare(b.interviewDate || b.assessmentDate));
  const avg = st.mocks.length ? C.round(st.mocks.slice(0, 5).reduce((s, m) => s + m.avg, 0) / Math.min(5, st.mocks.length), 1) : null;
  const next = STAR_QS.find(q => !starReady(starAns(q.id)));
  return `<div class="grid g2"><div class="card"><h2>Readiness</h2><div class="kv" style="margin-top:8px">
  <span>Self-intro</span>${meter(st.introDone ? 1 : 0, 1)}<span>${st.introDone ? "Ready" : "To do"}</span>
  <span>STAR answers</span>${meter(st.ready, 8)}<span>${st.ready} / 8+</span>
  <span>Common questions</span>${meter(st.common, COMMON_QS.length)}<span>${st.common} / ${COMMON_QS.length}</span>
  <span>Mock interviews</span>${meter(st.mocks.length, 6)}<span>${st.mocks.length} done</span></div>
  <p class="muted" style="font-size:14px;margin-top:10px">Eight strong STAR stories cover almost every behavioural question — one story can answer several. ${avg != null ? `Your last mocks average <b>${avg}/5</b>.` : ""}</p>
  ${next ? `<div class="note info" style="margin-top:8px">Next to prepare: <b>${esc(next.q)}</b> <button class="btn small" data-act="openStar" data-id="${next.id}">Write answer</button></div>` : ""}</div>
  <div class="card"><h2>Upcoming interviews & assessments</h2>${up.length ? `<ul class="list">${up.map(j => `<li><div class="grow"><div class="t1">${esc(j.role)} · ${esc(j.company)}</div><div class="t2">${j.interviewDate ? "Interview " + shortDate(j.interviewDate) : ""}${j.assessmentDate ? " Assessment " + shortDate(j.assessmentDate) : ""}</div></div><button class="btn small primary" data-act="jobPrep" data-id="${j.id}">Prepare</button></li>`).join("")}</ul>` : `<p class="empty">None booked. When you add an interview date to a job, a tailored preparation pack appears here.</p>`}</div></div>
  <div class="card" style="margin-top:14px"><h2>A good week of interview practice</h2><ul style="font-size:14px;line-height:1.7"><li>Daily (15 min, in your morning or review block): say your self-intro once and one STAR answer out loud, timed.</li><li>Twice a week: one 2-minute communication drill — explain something technical to a non-technical listener.</li><li>Weekly: a 5-question mock interview, ideally recorded on your phone. Watch it back and pick one fix.</li><li>Before each real interview: open its preparation pack 2 days ahead.</li></ul></div>`;
}

  <div class="stack"><div class="card"><div class="head"><h2>90-second version</h2><span class="badge acc" id="introLongT">${nl} words ≈ ${speakTime(nl)}</span></div><p id="introLong" style="line-height:1.6">${esc(sc.long)}</p>

SYNC.introF = el => { const o = intro(); o[el.dataset.f] = el.value; S.kv.intro = o; const sc = introScripts(o); const l = $("#introLong"); if (l) { l.textContent = sc.long; $("#introShort").textContent = sc.short; $("#introLongT").textContent = words(sc.long) + " words ≈ " + speakTime(words(sc.long)); } };

function ivComms() {
  const d = DRILLS[Math.abs(C.daysBetween("2026-01-01", todayKey())) % DRILLS.length];
  return `<div class="note info" style="margin-bottom:14px"><b>Today's 2-minute drill:</b> ${esc(d)} <button class="btn small" data-act="timer" data-label="Communication drill" data-min="2">Start 2-min timer</button></div>
  <div class="grid g2">${COMMS.map(c => `<div class="card"><h3>${esc(c.t)}</h3><p style="font-size:14px;line-height:1.55">${esc(c.b)}</p></div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><h2>All drills</h2><p class="muted" style="font-size:14px">Say each in 60–120 seconds to an imaginary non-technical manager. Count your filler words ("um", "like", "basically") and try to halve them next time.</p><ul class="list">${DRILLS.map(x => `<li><div class="grow">${esc(x)}</div><button class="btn small" data-act="timer" data-label="Drill" data-min="2">2 min</button></li>`).join("")}</ul></div>`;
}

function buildMock(n, jobId, kinds) {
  const pick = (arr, c) => arr.slice().sort(() => Math.random() - 0.5).slice(0, c);
  const j = jobId ? S.rec.get(jobId) : null;
  const tech = j && j.jd ? C.parseJD(j.jd, kv("skills"), settings().career.extraSkills).questions.filter(x => !/Why this role/.test(x)) : LESSONS.filter(l => l.week <= weekNo(todayKey()) + 1).map(l => l.interview);
  const qs = [{q: "Tell me about yourself.", kind: "Opening"}];
  const nStar = Math.max(1, Math.round((n - 1) * 0.5)), nTech = kinds.tech ? Math.max(1, Math.round((n - 1) * 0.3)) : 0, nCommon = Math.max(0, n - 1 - nStar - nTech);
  pick(STAR_QS, nStar).forEach(x => qs.push({q: x.q, kind: "Behavioural (STAR)", qid: x.id}));
  pick(tech, nTech).forEach(x => qs.push({q: x, kind: "Technical"}));
  pick(COMMON_QS.filter(x => !["c1","c11","c10"].includes(x.id)), nCommon).forEach(x => qs.push({q: x.q, kind: "Motivation"}));
  qs.push({q: "Do you have any questions for us?", kind: "Closing"});
  return {qs, i: 0, notes: {}, scores: {}, job: jobId || null, started: Date.now()};
}

let installEvt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (S.view === "settings") render(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("Life OS installed — open it from your home screen."); askPersist(); if (S.view === "settings") render(); });
async function askPersist() { try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) {} }
if (isStandalone()) askPersist();
if ("serviceWorker" in navigator && (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) {
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js");
      const offerUpdate = w => { S.ui.swWaiting = w; toast("A new version of Life OS is ready — open Settings to update."); if (S.view === "settings") render(); };
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) offerUpdate(w); }); });
      let reloaded = false; navigator.serviceWorker.addEventListener("controllerchange", () => { if (S.ui.applyingUpdate && !reloaded) { reloaded = true; location.reload(); } }); // only after "Update now", never on first install
      window.LIFEOS_SW = true;
    } catch (e) { console.warn("Service worker failed", e); }
  });
}

/* ===== Boot ===== */
(async function boot() {
  await Store.open();
  const loaded = await Store.loadAll();
  const D = DEFAULTS();
  S.kv = Object.assign({}, D, loaded.kv);
  // fill settings fields added in later versions without touching saved values
  const ss = S.kv.settings = Object.assign({}, D.settings, loaded.kv.settings || {});
  ["profile", "schedule", "diet", "food", "career", "training"].forEach(g => ss[g] = Object.assign({}, D.settings[g], ss[g] || {}));
  const first = !loaded.kv.settings;
  if (first) Object.keys(S.kv).forEach(k => Store.putKV(k, S.kv[k]));
  S.rec = new Map(loaded.rec.map(r => [r.id, r]));
  // one-time switch to the simple repeating Indian meal pattern (no tofu, no cheese, chapatis); keeps all other data
  if (!first && ((S.kv.meta || {}).mealVersion || 1) < 2) {
    const today = todayKey();
    S.kv.planTemplate = JSON.parse(JSON.stringify(DEFAULT_PLAN));
    const o = Object.assign({}, S.kv.planOverrides || {}); Object.keys(o).forEach(k => { if (k >= today) delete o[k]; }); S.kv.planOverrides = o;
    ss.diet.exclude = [...new Set((ss.diet.exclude || []).concat(DEFAULT_EXCLUDE))];
    S.kv.pantry = Object.assign({turmeric: DEFAULT_PANTRY.turmeric}, S.kv.pantry || {});
    if (ss.schedule.prepMinutes === 75) ss.schedule.prepMinutes = 90;
    S.kv.meta = Object.assign({}, S.kv.meta, {mealVersion: 2});
    ["planTemplate", "planOverrides", "settings", "pantry", "meta"].forEach(k => Store.putKV(k, S.kv[k]));
    S.migratedMeals = true;
  }
  // v3: more filling — chickpea & bean salad replaces roasted chana (only where you hadn't changed the slot)
  if (!first && ((S.kv.meta || {}).mealVersion || 1) < 3) {
    const t = JSON.parse(JSON.stringify(S.kv.planTemplate || DEFAULT_PLAN));
    Object.keys(t).forEach(d => { if (t[d] && t[d].snack2 === "roastchickpeas") t[d].snack2 = "beansalad"; });
    S.kv.planTemplate = t; S.kv.meta = Object.assign({}, S.kv.meta, {mealVersion: 3});
    ["planTemplate", "meta"].forEach(k => Store.putKV(k, S.kv[k])); S.migratedMeals = true;
  }
  // v4: 800 kcal fixed deficit (as requested) with trimmed portions
  if (!first && ((S.kv.meta || {}).mealVersion || 1) < 4) {
    ss.profile.deficitKcal = 800; Store.putKV("settings", ss);
    S.kv.meta = Object.assign({}, S.kv.meta, {mealVersion: 4}); Store.putKV("meta", S.kv.meta); S.migratedDeficit = true;
  }
  // v5: postman (~15,000 steps/day) activity level
  if (!first && ((S.kv.meta || {}).mealVersion || 1) < 5) {
    if (ss.profile.activity == 1.55) ss.profile.activity = 1.65;
    S.kv.habits = (S.kv.habits || []).map(h => h.id === "h3" && h.name === "8,000+ steps" ? {id: "h3", name: "Foot & calf stretch after the round"} : h);
    S.kv.meta = Object.assign({}, S.kv.meta, {mealVersion: 5}); ["settings", "habits", "meta"].forEach(k => Store.putKV(k, S.kv[k])); S.migratedSteps = true;
  }
  // v6: goal modes + physique programme
  if (!first && ((S.kv.meta || {}).mealVersion || 1) < 6) {
    if (!ss.profile.goal) ss.profile.goal = ss.profile.deficitKcal === 800 ? "standard" : "custom";
    S.kv.meta = Object.assign({}, S.kv.meta, {mealVersion: 6}); ["settings", "meta"].forEach(k => Store.putKV(k, S.kv[k])); S.migratedGoals = true;
  }
  // v8: fresh daily cooking — no batch cooking, no reheating; cold lunch rolls; short ingredient prep
  if (!first && ((S.kv.meta || {}).mealVersion || 1) < 8) {
    const today = todayKey();
    S.kv.planTemplate = JSON.parse(JSON.stringify(DEFAULT_PLAN));
    const o = Object.assign({}, S.kv.planOverrides || {}); Object.keys(o).forEach(k => { if (k >= today) delete o[k]; }); S.kv.planOverrides = o;
    if (!ss.schedule.prepMinutes || ss.schedule.prepMinutes > 45) ss.schedule.prepMinutes = 30;
    S.kv.meta = Object.assign({}, S.kv.meta, {mealVersion: 8}); ["planTemplate", "planOverrides", "settings", "meta"].forEach(k => Store.putKV(k, S.kv[k])); S.migratedFresh = true;
  }
  // v7: plan start date, weekly working pattern, workout time
  if (!ss.training.startDate) { ss.training.startDate = first ? todayKey() : (ss.career.startDate || todayKey()); Store.putKV("settings", ss); }
  if (!ss.schedule.workdays) ss.schedule.workdays = [true, true, true, true, true, true, true];
  if (!ss.schedule.trainTime) ss.schedule.trainTime = "evening";
  refreshCatalog(); applyTheme();
  window.addEventListener("hashchange", route);
  S.view = viewFromHash(location.hash) || "today"; render();
  document.documentElement.dataset.ready = "1";
  if (first) toast("Welcome — your plan is set up from your profile. Data stays on this device.");
  else if (S.migratedFresh) toast("Meals switched to fresh daily cooking (~25 min a day), cold lunch rolls, no reheating.");
  else if (S.migratedGoals) toast("New: goal modes (incl. aggressive fat loss) in Settings, and a muscle + abs training programme.");
  else if (S.migratedSteps) toast("Updated for ~15,000 steps a day: target ≈2,500 kcal with an 800 kcal deficit.");
  else if (S.migratedDeficit) toast("Updated: 800 kcal deficit (≈2,300 kcal/day), portions trimmed, protein kept high.");
  else if (S.migratedMeals) toast("Meals updated: more filling Indian pattern with salads, beans and seeds.");
})();

</script>
